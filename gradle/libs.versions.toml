# Versions here mirror profiles/26.2.json. When bumping a Minecraft version,
# update the profile first, then align these compile-time versions with it.
[versions]
minecraft = "26.2"
java = "25"
neoforge = "26.2.0.59"
fancymodloader = "11.0.16"
fabricLoader = "0.19.3"
mixin = "0.17.3+mixin.0.8.7"
asm = "9.10.1"
log4j = "2.22.1"
gson = "2.14.0"

[libraries]
# NeoForge side: the loader jar also contains the whole net.neoforged.neoforgespi API.
fml-loader = { module = "net.neoforged.fancymodloader:loader", version.ref = "fancymodloader" }
neoforge-bus = { module = "net.neoforged:bus", version = "8.0.5" }

# Fabric side
fabric-loader = { module = "net.fabricmc:fabric-loader", version.ref = "fabricLoader" }

# Shared between both loaders — identical versions, which is what makes the bridge cheap.
mixin = { module = "net.fabricmc:sponge-mixin", version.ref = "mixin" }
asm = { module = "org.ow2.asm:asm", version.ref = "asm" }
asm-tree = { module = "org.ow2.asm:asm-tree", version.ref = "asm" }

log4j-api = { module = "org.apache.logging.log4j:log4j-api", version.ref = "log4j" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
annotations = { module = "org.jetbrains:annotations", version = "26.0.1" }
slf4j = { module = "org.slf4j:slf4j-api", version = "2.0.16" }

# NeoForge parses mod metadata through NightConfig. Forgeric builds an in-memory
# config from fabric.mod.json and hands it to NeoForge's own ModFileInfo/ModInfo.
nightconfig-core = { module = "com.electronwill.night-config:core", version = "3.9.0" }
nightconfig-toml = { module = "com.electronwill.night-config:toml", version = "3.9.0" }
maven-artifact = { module = "org.apache.maven:maven-artifact", version = "3.9.16" }

junit = { module = "org.junit.jupiter:junit-jupiter", version = "5.11.4" }
junit-launcher = { module = "org.junit.platform:junit-platform-launcher", version = "1.11.4" }

forgericVersion=0.1.0

# Gradle does not auto-detect Homebrew's keg-only JDKs. Non-existent paths are ignored,
# so listing common locations here is harmless and saves a manual toolchain setup.
org.gradle.java.installations.paths=/opt/homebrew/opt/openjdk@25/libexec/openjdk.jdk/Contents/Home,/usr/local/opt/openjdk@25/libexec/openjdk.jdk/Contents/Home

org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.caching=true
